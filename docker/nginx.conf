# ─── Nginx 反向代理設定 ──────────────────────────────────────
# 用途：
# 1. 託管前端 Vue SPA 靜態產物 (/usr/share/nginx/html)
# 2. 將 /api/ 開頭的 HTTP 請求反代至後端 Rust 容器 (http://server:3030)
# 3. 將 /ws 的 WebSocket 請求反代至後端 Rust 容器並進行協定升級

# 定義後端伺服器 (在 docker-compose 內部網路中服務名稱為 server)
upstream rust_backend {
    server server:3030;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # 放寬上傳與大型劇本 JSON 請求大小限制 (預設僅 1MB 會觸發 413 Request Entity Too Large)
    client_max_body_size 50M;

    # 啟用 Gzip 傳輸壓縮
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_vary on;

    # 1. 前端靜態頁面託管
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 支援 Vue SPA 歷史路由，找不到檔案時回退至 index.html
        try_files $uri $uri/ /index.html;

        # 靜態資源快取優化 (針對 assets 下帶 hash 的檔案)
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. 魔典 RESTful HTTP API 反向代理
    location /api/ {
        proxy_pass http://rust_backend/api/;
        proxy_http_version 1.1;

        # 傳遞真實客戶端資訊與 Host 標頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 逾時設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. 即時連線 WebSocket 反向代理
    location /ws {
        proxy_pass http://rust_backend/ws;
        proxy_http_version 1.1;

        # 核心：協定升級為 WebSocket 必備標頭
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 長連線保持 (防止閒置時被 Nginx 提前切斷)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
