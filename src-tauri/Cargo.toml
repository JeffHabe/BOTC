[package]
name = "botc-grimoire"
version = "0.1.0"
description = "染鐘樓謎團魔典 - Blood on the Clocktower Grimoire App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-sharekit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri-plugin-log = "2"
shared = { path = "../shared" }

[profile.dev.package."*"]
opt-level = 3 # 讓引用的第三方庫（如 tauri 等）運行更快，減少開發時的發熱與卡頓
